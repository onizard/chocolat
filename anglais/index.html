<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2B415">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>Norah's Spelling Bee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Mise en page : une colonne étroite posée sur une feuille Seyès (marge rouge, lignes bleues),
   les cartes sont des fiches bristol blanches, l'accent est le jaune miel du « Spelling Bee ». */
:root{
  --paper:#F7F9FD;
  --line:rgba(70,110,190,.10);
  --line-strong:rgba(70,110,190,.22);
  --margin:rgba(214,84,96,.45);
  --card:#FFFFFF;
  --ink:#1D2333;
  --ink-soft:#586079;
  --border:#D5DBE7;
  --honey:#F2B415;
  --honey-ink:#7A5400;
  --honey-pale:#FFF3CF;
  --on-honey:#1D2333;
  --fr:#2F5DB8;
  --fr-pale:#E5ECFA;
  --en:#B83A45;
  --en-pale:#FBE6E8;
  --ok:#23804F;
  --ok-pale:#DDF2E5;
  --bad:#C23B30;
  --bad-pale:#FBE3E0;
  --shadow:0 1px 0 rgba(29,35,51,.06), 0 6px 18px -8px rgba(29,35,51,.25);
  --f-display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131722; --line:rgba(120,150,220,.07); --line-strong:rgba(120,150,220,.14);
    --margin:rgba(230,110,120,.35); --card:#1D2230; --ink:#ECEFF6; --ink-soft:#A2AAC0;
    --border:#30384A; --honey:#F5C33B; --honey-ink:#F5C33B; --honey-pale:#3A3115; --on-honey:#1D2333;
    --fr:#8DB0F5; --fr-pale:#22304D; --en:#F2939B; --en-pale:#43242A;
    --ok:#62CB8F; --ok-pale:#173B28; --bad:#F2857A; --bad-pale:#45201D;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 22px -10px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131722; --line:rgba(120,150,220,.07); --line-strong:rgba(120,150,220,.14);
  --margin:rgba(230,110,120,.35); --card:#1D2230; --ink:#ECEFF6; --ink-soft:#A2AAC0;
  --border:#30384A; --honey:#F5C33B; --honey-ink:#F5C33B; --honey-pale:#3A3115; --on-honey:#1D2333;
  --fr:#8DB0F5; --fr-pale:#22304D; --en:#F2939B; --en-pale:#43242A;
  --ok:#62CB8F; --ok-pale:#173B28; --bad:#F2857A; --bad-pale:#45201D;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 22px -10px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:
    linear-gradient(90deg, transparent 38px, var(--margin) 38px, var(--margin) 40px, transparent 40px),
    repeating-linear-gradient(180deg, transparent 0 31px, var(--line-strong) 31px 32px),
    repeating-linear-gradient(180deg, transparent 0 7px, var(--line) 7px 8px);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:17px;
  line-height:1.5;
  min-height:100vh;
}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
@media (min-width:700px){ .wrap{padding-inline:24px} }
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,.chip:focus-visible{outline:3px solid var(--fr);outline-offset:2px}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
.brand p{margin:0;color:var(--ink-soft);font-size:.9rem}
.iconbtn{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:8px 14px;font-size:.9rem;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{border-color:var(--ink-soft)}

/* Blocs de réglages */
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.label{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.seg{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
.seg button{border:2px solid var(--border);background:transparent;border-radius:12px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center;min-width:0}
.seg button b{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.seg button .sub{font-size:.8rem;color:var(--ink-soft);line-height:1.25}
.seg button[aria-pressed="true"]{border-color:var(--honey);background:var(--honey-pale)}
.seg.small button{padding:8px 6px}
.dir{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:6px}
.tag.fr{background:var(--fr-pale);color:var(--fr)}
.tag.en{background:var(--en-pale);color:var(--en)}

.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.chip{border:2px solid var(--border);background:transparent;border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.chip[aria-pressed="true"]{border-color:var(--honey);background:var(--honey-pale)}
.chip .n{font-weight:700;line-height:1.2}
.chip .meta{font-size:.78rem;color:var(--ink-soft);display:flex;justify-content:space-between;gap:6px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--border);overflow:hidden}
.bar i{display:block;height:100%;background:var(--honey);border-radius:99px;transition:width .4s}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.link{background:none;border:0;padding:0;color:var(--fr);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:.9rem}

.go{background:var(--honey);color:var(--on-honey);border:0;border-radius:14px;padding:16px 20px;font-family:var(--f-display);font-weight:600;font-size:1.25rem;box-shadow:0 3px 0 var(--honey-ink);width:100%}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 var(--honey-ink)}
.go:disabled{opacity:.5;cursor:not-allowed}
.ghost{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:12px 16px;font-weight:700}
.ghost:hover{border-color:var(--ink-soft)}
.hint{font-size:.85rem;color:var(--ink-soft);margin:0}

/* Séance */
.prog{display:flex;align-items:center;gap:12px}
.prog .bar{flex:1;height:10px}
.prog span{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem;color:var(--ink-soft)}
.stage{perspective:1400px}
.flash{position:relative;min-height:260px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1);cursor:pointer}
.flash.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;overflow:hidden}
.face::before{content:"";position:absolute;left:0;right:0;top:0;height:8px}
.face.fr::before{background:var(--fr)}
.face.en::before{background:var(--en)}
.face.back{transform:rotateY(180deg)}
.word{font-family:var(--f-display);font-weight:600;font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.2;overflow-wrap:anywhere;text-wrap:balance}
.note{color:var(--ink-soft);font-size:.9rem;margin:0}
.tap{position:absolute;bottom:12px;font-size:.8rem;color:var(--ink-soft)}
.speak{border:1px solid var(--border);background:var(--card);border-radius:999px;width:44px;height:44px;display:inline-grid;place-items:center;color:var(--en)}
.speak:hover{border-color:var(--en)}
.prompt{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 20px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;position:relative;overflow:hidden}
.prompt::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--fr)}
.prompt.en::before{background:var(--en)}
.prompt.dict::before{background:var(--honey)}
.answer{display:flex;flex-direction:column;gap:10px}
.answer input{width:100%;font-family:var(--f-body);font-size:1.4rem;padding:14px 16px;border-radius:14px;border:2px solid var(--border);background:var(--card);color:var(--ink);text-align:center;letter-spacing:.02em}
.answer input:focus{border-color:var(--fr);outline:none}
.answer input.ok{border-color:var(--ok);background:var(--ok-pale)}
.answer input.bad{border-color:var(--bad);background:var(--bad-pale)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns.one{grid-template-columns:1fr}
.b-ok{background:var(--ok);color:var(--card);border:0;border-radius:14px;padding:14px;font-weight:700;font-size:1.05rem}
.b-bad{background:var(--bad);color:var(--card);border:0;border-radius:14px;padding:14px;font-weight:700;font-size:1.05rem}
.feedback{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.feedback.ok{background:var(--ok-pale);color:var(--ink)}
.feedback.bad{background:var(--bad-pale);color:var(--ink)}
.feedback h3{font-size:1.15rem}
.feedback.ok h3{color:var(--ok)}
.feedback.bad h3{color:var(--bad)}
.spell{font-family:var(--f-body);font-size:1.35rem;letter-spacing:.06em;font-weight:700;overflow-wrap:anywhere}
.spell .x{background:var(--bad);color:var(--card);border-radius:4px;padding:0 2px}
.spell .g{background:var(--ok);color:var(--card);border-radius:4px;padding:0 2px}
.spell .gap{display:inline-block;min-width:.6em;border-bottom:3px solid var(--ok)}
.spell s{text-decoration-thickness:2px}
.small{font-size:.85rem;color:var(--ink-soft)}
.dictbtn{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.big-listen{background:var(--honey);color:var(--on-honey);border:0;border-radius:999px;padding:14px 26px;font-family:var(--f-display);font-weight:600;font-size:1.2rem;display:inline-flex;gap:10px;align-items:center;box-shadow:0 3px 0 var(--honey-ink)}

/* Résultats */
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-family:var(--f-display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.mist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mist li{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--border);align-items:center}
.mist li span{min-width:0;overflow-wrap:anywhere}
.mist .e{font-weight:700;color:var(--en)}
.mist .f{color:var(--fr)}

/* Liste */
.list h2{font-size:1.25rem;margin-bottom:6px}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl td{padding:8px 6px;border-top:1px solid var(--border);vertical-align:middle}
.tbl td.f{color:var(--ink-soft);width:45%}
.tbl td.e{font-weight:700}
.tbl td.s{width:36px;text-align:right}
.tbl .speak{width:32px;height:32px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--border);vertical-align:middle}
.dot.l1,.dot.l2{background:var(--honey)}
.dot.l3,.dot.l4,.dot.l5{background:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-soft)}
.danger{color:var(--bad);border-color:var(--bad-pale)}
footer{font-size:.8rem;color:var(--ink-soft);text-align:center}

@media (max-width:420px){
  .seg button .sub{display:none}
  .brand h1{font-size:1.35rem}
}
@media (prefers-reduced-motion: reduce){
  .flash{transition:none}
  .bar i{transition:none}
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <svg width="46" height="46" viewBox="0 0 64 64" aria-hidden="true">
        <ellipse cx="22" cy="20" rx="11" ry="8" fill="var(--fr-pale)" stroke="var(--fr)" stroke-width="2" transform="rotate(-25 22 20)"/>
        <ellipse cx="40" cy="18" rx="11" ry="8" fill="var(--fr-pale)" stroke="var(--fr)" stroke-width="2" transform="rotate(25 40 18)"/>
        <ellipse cx="32" cy="38" rx="18" ry="15" fill="var(--honey)"/>
        <path d="M24 25.5v25M32 23v30M40 25.5v25" stroke="var(--ink)" stroke-width="4.5"/>
        <circle cx="47" cy="34" r="2.3" fill="var(--ink)"/>

      <div>
        <h1>Norah's Spelling Bee</h1>

</div>

const ARTS = ['a', 'an', 'the', 'to'];

    answered(false);
    finish(false, `<div class="feedback bad"><h3>Voici la réponse</h3>
      <div class="spell" ${target === 'en' ? 'lang="en"' : ''}>${esc(target === 'en' ? c.en : c.fr)}</div>
      ${c.note && target === 'en' ? `<p class="note">${esc(c.note)}</p>` : ''}
      ${target === 'en' && canSpeak ? `<div><button type="button" class="speak" data-say="1" aria-label="Écouter">${SPK}</button></div>` : ''}
      <p class="small" style="margin:0">Ce mot reviendra un peu plus loin.</p></div>`);
  };
  form.onsubmit = e => {
    e.preventDefault();
    if (done) return next();
    const val = input.value;
    if (!val.trim()) { input.focus(); return; }
    if (target === 'fr') {
      const ok = checkFr(val, c);
      answered(ok);
      finish(ok, ok
        ? `<div class="feedback ok"><h3>Bravo !</h3><div class="small">${esc(c.fr)}</div></div>`
        : `<div class="feedback bad"><h3>Pas tout à fait</h3>
            <div class="small">On attendait :</div><div class="spell">${esc(c.fr)}</div>
            <div><button class="link" type="button" id="override">J'avais trouvé, c'est juste dit autrement</button></div></div>`);
      return;
    }
    const r = checkEn(val, c);
    answered(r.ok);
    if (r.ok) {
      finish(true, `<div class="feedback ok"><h3>${['Perfect!', 'Well done!', 'Great!', 'Brilliant!'][Math.floor(Math.random() * 4)]}</h3>
        <div class="spell" lang="en">${esc(c.en)}</div>${c.note ? `<p class="note">${esc(c.note)}</p>` : ''}
        ${dir !== 'dict' ? '' : `<div class="small">${esc(c.fr)}</div>`}</div>`);
      say(c.en);
    } else {
      const typed = norm(val);
      const close = r.caseOnly || levDist(typed.toLowerCase(), r.best.toLowerCase()) <= Math.max(2, Math.floor(r.best.length / 3));
      const d = diffHtml(typed, r.best, r.caseOnly);
      finish(false, `<div class="feedback bad"><h3>${r.caseOnly ? 'Attention à la majuscule !' : close ? 'Presque… regarde bien les lettres' : 'Pas tout à fait'}</h3>
        ${close ? `<div class="small">Tu as écrit :</div><div class="spell" lang="en">${d.mine}</div>
        <div class="small">La bonne orthographe :</div><div class="spell" lang="en">${d.good}</div>`
        : `<div class="small">La bonne réponse :</div><div class="spell" lang="en">${esc(c.en)}</div>`}
        ${c.note ? `<p class="note">${esc(c.note)}</p>` : ''}
        ${dir === 'dict' ? `<div class="small">Sens : ${esc(c.fr)}</div>` : ''}
        ${canSpeak ? `<div><button type="button" class="speak" data-say="1" aria-label="Écouter">${SPK}</button></div>` : ''}
        <p class="small" style="margin:0">Ce mot reviendra un peu plus loin.</p></div>`);
    }
  };
}

function results() {
  const s = session;
  const ids = Object.keys(s.first), good = ids.filter(id => s.first[id]).length;
  const wrong = ids.filter(id => !s.first[id]);
  const pct = ids.length ? good / ids.length : 0;
  const msg = pct === 1 ? 'Un sans-faute, bravo Norah !' : pct >= .8 ? 'Très bien, encore un petit effort.' : pct >= .5 ? 'C\'est en bonne voie. On revoit les erreurs ?' : 'On s\'accroche : revois les erreurs, ça va venir.';
  view.innerHTML = `<div class="wrap" style="padding:0">
    <section class="panel">
      <span class="label">Résultat du premier coup</span>
      <div class="score"><b>${good}/${ids.length}</b><span>${msg}</span></div>
      <span class="bar" style="height:10px"><i style="width:${Math.round(pct * 100)}%"></i></span>
    </section>
    ${wrong.length ? `<section class="panel"><span class="label">À revoir (${wrong.length})</span>
      <ul class="mist">${wrong.map(id => { const c = byId[id]; return `<li><span class="f">${esc(c.fr)}</span><span aria-hidden="true">→</span><span class="e" lang="en">${esc(c.en)}</span></li>`; }).join('')}</ul></section>` : ''}
    ${wrong.length ? `<button class="go" id="again">Revoir mes ${wrong.length} erreur${wrong.length > 1 ? 's' : ''}</button>` : ''}
    <div class="btns"><button class="ghost" id="new" type="button">Nouvelle série</button><button class="ghost" id="back" type="button">Accueil</button></div>
  </div>`;
  if (wrong.length) view.querySelector('#again').onclick = () => start(wrong);
  view.querySelector('#new').onclick = () => start();
  view.querySelector('#back').onclick = home;
}

function list() {
  homeBtn.hidden = false;
  view.innerHTML = `<div class="wrap" style="padding:0">
    <div class="legend"><span><i class="dot"></i>pas encore su</span><span><i class="dot l1"></i>en cours</span><span><i class="dot l3"></i>su</span></div>
    ${THEMES.map(t => `<section class="panel list"><h2>${esc(t.nom)} <span class="small">· ${esc(t.sous)}</span></h2>
      <div style="overflow-x:auto"><table class="tbl"><tbody>${t.cards.map(c => `<tr><td class="f"><i class="dot l${boxOf(c.id)}"></i>${esc(c.fr)}</td><td class="e" lang="en">${esc(c.en)}</td><td class="s">${canSpeak ? `<button type="button" class="speak" data-en="${esc(c.en)}" aria-label="Écouter ${esc(c.en)}">${SPK}</button>` : ''}</td></tr>`).join('')}</tbody></table></div></section>`).join('')}
    <section class="panel"><span class="label">Repartir de zéro</span>
      <p class="hint">Efface les progrès enregistrés sur cet appareil.</p>
      <div class="row"><button class="ghost danger" id="reset" type="button">Effacer les progrès</button></div></section>
  </div>`;
  view.querySelectorAll('[data-en]').forEach(b => b.onclick = () => say(b.dataset.en));
  const reset = view.querySelector('#reset');
  reset.onclick = () => {
    if (reset.dataset.armed) { store.boxes = {}; save(); list(); return; }
    reset.dataset.armed = '1'; reset.textContent = 'Sûr ? Touche encore pour effacer';
  };
  window.scrollTo(0, 0);
}

if (canSpeak) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
home();
</script>
</body>
</html>
