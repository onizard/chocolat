<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16283C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Chocolat — programme ventre plat</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --encre:#16283C;
  --encre2:#41566C;
  --encre3:#7D8FA0;
  --brume:#E7ECEF;
  --surface:#FFFFFF;
  --sable:#F3F1EB;
  --teal:#1C6E68;
  --teal-pale:#DCEBE8;
  --ambre:#E0A33C;
  --ambre-pale:#FAEFD8;
  --rouge:#A93B2C;
  --rouge-pale:#F7E4E0;
  --trait:#CBD5DC;
  --bleu-eau:#2E7FA8; --bleu-pale:#E2EEF5;
  --vert:#DDEEDA; --vert-fort:#3E7D4A;
  --jaune:#F3E2AF; --jaune-fort:#9C7412;
  --r:14px;
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--brume);
  color:var(--encre);
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.5;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;font-weight:800;letter-spacing:-.02em;margin:0}
.mono{font-family:"Space Mono",ui-monospace,monospace}
.eyebrow{font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--encre3)}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px;color:var(--encre)}
:focus-visible{outline:2.5px solid var(--ambre);outline-offset:2px;border-radius:4px}

/* ---------- SIGNATURE : le ruban métreur ---------- */
.ruban{
  position:sticky;top:0;z-index:40;
  background:var(--encre);color:#fff;
  padding:calc(14px + env(safe-area-inset-top)) 18px 0;
}
.ruban-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ruban-head .t{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;letter-spacing:-.01em}
.ruban-head .s{font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.14em;color:#8FA6BB;text-transform:uppercase}
.tape{display:block;width:100%;height:44px;margin-top:6px}
.tape .maj{stroke:#F6F1E6;stroke-width:1.6}
.tape .min{stroke:#54697E;stroke-width:1}
.tape .num{font-family:"Space Mono",monospace;font-size:8.5px;fill:#8FA6BB}
.tape .num.on{fill:var(--ambre)}
.tape .cur{fill:var(--ambre)}
.tape .base{stroke:#2C4058;stroke-width:1}

/* ---------- structure ---------- */
main{padding:16px 14px 24px;max-width:640px;margin:0 auto}
.card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(22,40,60,.06)}
.card.flat{box-shadow:none;background:var(--sable)}
.sect-title{font-size:19px;margin:22px 2px 10px}
.sect-title:first-child{margin-top:4px}
hr.hair{border:none;border-top:1px solid var(--trait);margin:14px 0}

/* ---------- chiffres ---------- */
.bignum{font-family:"Space Mono",monospace;font-weight:700;font-size:40px;line-height:1;letter-spacing:-.03em}
.macro-row{display:flex;gap:8px;margin-top:14px}
.macro{flex:1;background:var(--sable);border-radius:10px;padding:9px 10px}
.macro .k{font-family:"Space Mono",monospace;font-size:9.5px;letter-spacing:.12em;color:var(--encre3);text-transform:uppercase}
.macro .v{font-family:"Space Mono",monospace;font-weight:700;font-size:17px;margin-top:3px}
.macro .u{font-size:11px;font-weight:400;color:var(--encre2)}

/* ---------- formulaire ---------- */
label.f{display:block;margin-bottom:14px}
label.f > span{display:block;font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--encre3);margin-bottom:6px}
input[type=number],input[type=date],select{
  width:100%;padding:11px 12px;border:1px solid var(--trait);border-radius:10px;background:#fff;
}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{
  flex:1;min-width:74px;padding:10px 8px;border:1px solid var(--trait);border-radius:10px;background:#fff;
  font-size:13px;text-align:center;transition:.12s;
}
.seg button[aria-pressed=true]{background:var(--encre);color:#fff;border-color:var(--encre)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 12px;border:1px solid var(--trait);border-radius:999px;background:#fff;font-size:13px}
.chip[aria-pressed=true]{background:var(--teal-pale);border-color:var(--teal);color:var(--teal);font-weight:600}
.cta{
  width:100%;padding:15px;border-radius:12px;background:var(--teal);color:#fff;
  font-weight:600;font-size:15.5px;letter-spacing:.01em;
}
.cta.ghost{background:#fff;color:var(--encre);border:1px solid var(--trait)}
.cta.danger{background:#fff;color:var(--rouge);border:1px solid var(--rouge)}

/* ---------- dispo jours ---------- */
.day{border:1px solid var(--trait);border-radius:12px;padding:11px 12px;margin-bottom:8px;background:#fff}
.day-top{display:flex;align-items:center;gap:10px}
.day-name{font-weight:600;flex:1}
.tog{width:46px;height:27px;border-radius:999px;background:var(--trait);position:relative;transition:.15s;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog[aria-pressed=true]{background:var(--teal)}
.tog[aria-pressed=true]::after{transform:translateX(19px)}
.day-body{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.day-body select{padding:9px 10px;font-size:14px}

/* ---------- séances ---------- */
.sess{background:var(--surface);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:0 1px 2px rgba(22,40,60,.06)}
.sess.today{box-shadow:0 0 0 2px var(--ambre)}
.sess.rest{background:var(--sable);box-shadow:none}
.sess-head{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left}
.sess-day{font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--encre3);width:34px;flex:none}
.sess-t{flex:1}
.sess-t .n{font-weight:600;font-size:15px}
.sess-t .m{font-size:12.5px;color:var(--encre2);margin-top:1px}
.sess-time{font-family:"Space Mono",monospace;font-size:12px;color:var(--encre2);flex:none}
.caret{width:9px;height:9px;border-right:2px solid var(--encre3);border-bottom:2px solid var(--encre3);transform:rotate(45deg);flex:none;margin-left:2px;transition:.15s}
.sess[open-x] .caret{transform:rotate(-135deg)}
.sess-body{padding:0 16px 16px;border-top:1px solid var(--trait);margin-top:0;padding-top:12px}
.ex{display:flex;gap:10px;padding:8px 0;border-bottom:1px dotted var(--trait)}
.ex:last-child{border-bottom:none}
.ex .nm{flex:1;font-size:14px}
.ex .sr{font-family:"Space Mono",monospace;font-size:12.5px;color:var(--teal);font-weight:700;white-space:nowrap}
.ex .tip{font-size:12px;color:var(--encre3);margin-top:2px;line-height:1.35}

.ex .liens{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.ex .vid{font-size:11.5px;color:var(--teal);text-decoration:none;font-weight:600;
  border:1px solid var(--teal);border-radius:999px;padding:3px 10px;white-space:nowrap}
.ex .vid::before{content:"▶";font-size:8px;margin-right:5px;vertical-align:1px}
.ex .vid.mw{color:var(--encre);border-color:var(--trait)}
.ex .vid.mw::before{content:"◧"}
.ex .vid:active{opacity:.6}

.repas{border-top:1px solid var(--trait);padding:12px 0 4px}
.repas.off{opacity:.62}
.repas-h{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:nowrap}
.repas-h .lbl{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ambre);flex:1}
.repas.off .lbl{color:var(--encre3)}
.repas-h .kc{font-family:"Space Mono",monospace;font-size:11px;color:var(--encre2);
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.etape{border-left:2px solid var(--trait);padding-left:13px;margin:0 0 4px 5px;position:relative}
.etape:last-child{border-left-color:transparent}
.etape-h{display:flex;align-items:baseline;gap:9px;padding:14px 0 4px}
.etape-h .h{font-family:"Space Mono",monospace;font-size:11.5px;font-weight:700;color:var(--encre)}
.etape-h .q{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--encre3)}
.etape::before{content:"";position:absolute;left:-6px;top:19px;width:10px;height:10px;border-radius:50%;
  background:#fff;border:2px solid var(--trait)}
.etape.seance::before{border-color:var(--teal);background:var(--teal)}
.etape.repas-etape::before{border-color:var(--ambre);background:var(--ambre)}
.etape.marche::before{border-color:var(--encre2)}
.sous-titre{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--encre3);margin:10px 0 2px}
.etape .repas{border-top:none;padding-top:4px}

.etape.eau{border-left-color:var(--trait)}
.etape.eau::before{border-color:var(--bleu-eau);background:#fff}
.etape.eau .etape-h{padding:9px 0 3px}
.etape.eau .etape-h .q{color:var(--bleu-eau);flex:1}
.etape.eau .verres{font-family:"Space Mono",monospace;font-size:10.5px;color:var(--bleu-eau);letter-spacing:.06em}
.eau-total{display:flex;align-items:center;gap:8px;background:var(--bleu-pale);border-radius:10px;
  padding:9px 12px;font-size:13px;color:var(--encre2);margin-bottom:6px}
.eau-total b{color:var(--bleu-eau)}
.etape.repas-etape > .repas, .etape.repas-etape > .repas.off{
  background:var(--vert);border-radius:10px;padding:11px 12px;margin-bottom:2px}
.etape.repas-etape::before{border-color:var(--vert-fort);background:var(--vert-fort)}
.etape.repas-etape .etape-h .q{color:var(--vert-fort)}
.etape.seance .bloc-phys, .etape.marche .bloc-phys{
  background:var(--jaune);border-radius:10px;padding:6px 12px 10px}
.etape.seance::before{border-color:var(--jaune-fort);background:var(--jaune-fort)}
.etape.marche::before{border-color:var(--jaune-fort);background:#fff}
.etape.seance .etape-h .q, .etape.marche .etape-h .q{color:var(--jaune-fort)}
.bloc-phys .ex{border-bottom-color:rgba(22,40,60,.14)}
.demarrer{width:100%;padding:13px;border-radius:10px;background:var(--jaune-fort);color:#fff;
  font-weight:600;font-size:14.5px;margin:8px 0 4px;letter-spacing:.01em}
.demarrer::before{content:"▶";font-size:10px;margin-right:8px;vertical-align:1px}

.jeune-chip.valide.on{background:var(--teal);border-color:var(--teal);color:#fff}
.ic-wrap{position:relative;display:inline-flex}
.pastille{position:absolute;top:-5px;right:-9px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;
  background:var(--rouge);color:#fff;font-family:"Space Mono",monospace;font-size:9.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;line-height:1}

.sheet-ov{position:fixed;inset:0;z-index:150;background:rgba(22,40,60,.55);
  display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(22,40,60,.2)}
.sheet-nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;
  letter-spacing:-.01em;margin:6px 0 14px}
.sheet-in{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sheet-in input{flex:1;padding:14px 14px;font-size:19px;font-family:"Space Mono",monospace;
  border:1px solid var(--trait);border-radius:12px}
.sheet-in span{font-family:"Space Mono",monospace;font-size:14px;color:var(--encre2);min-width:48px}
.sheet .cta{margin-bottom:8px}

.ic-r{width:19px;height:19px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rule .m{display:flex;align-items:center;justify-content:center;width:24px}
.cle{color:var(--teal);font-weight:600}
.cle-a{color:var(--jaune-fort);font-weight:600}
.lien-danger{display:block;width:100%;text-align:center;margin-top:14px;font-size:12.5px;
  color:var(--encre3);text-decoration:underline;text-underline-offset:3px;padding:6px}
.lien-danger:active{color:var(--rouge)}
.lien-infos{display:inline-block;margin-top:12px;font-size:12.5px;font-weight:600;color:var(--teal);
  border-bottom:1px solid var(--teal);padding:0 0 1px;line-height:1.2}
.lien-infos::before{content:"ⓘ";margin-right:6px;font-weight:400}

/* ---------- guide respiratoire ---------- */
.g-ov{position:fixed;inset:0;z-index:200;background:var(--encre);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));text-align:center}
.g-close{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;z-index:3;
  width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:17px}
.g-num{font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.16em;color:#8FA6BB;text-transform:uppercase}
.g-nom{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:30px;line-height:1.12;
  letter-spacing:-.02em;margin:10px 0 6px;max-width:16ch}
.g-sr{font-family:"Space Mono",monospace;font-size:15px;color:var(--ambre)}
.g-tip{font-size:13px;color:#A9BCCD;line-height:1.45;max-width:34ch;margin-top:10px}
.g-pret{margin-top:26px;padding:20px 52px;border-radius:999px;background:var(--ambre);color:var(--encre);
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:21px;letter-spacing:-.01em}
.g-disc{position:relative;display:flex;align-items:center;justify-content:center}
.g-fond{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(92vw,420px);height:min(48vw,215px);display:flex;align-items:center;justify-content:center;
  opacity:.72;pointer-events:none;z-index:0}
.g-fond-svg{width:100%;height:100%}
.g-svg{position:relative;z-index:1}
/* disque translucide : la silhouette reste visible au travers */
.g-cercle{fill-opacity:.42}
.g-halo{stroke-opacity:.85}
.g-serie{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.08em;color:var(--ambre);margin-top:10px;text-transform:uppercase}
.g-ov > *:not(.g-close){position:relative;z-index:1}   /* la croix garde son positionnement absolu */
.g-scene{display:none;flex-direction:column;align-items:center;margin-top:14px;position:relative}
.g-svg{width:min(62vw,238px);height:min(62vw,238px);display:block}
.g-compte{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;
  font-family:"Space Mono",monospace;font-weight:700;font-size:30px;color:#fff;
  text-shadow:0 1px 6px rgba(10,20,32,.75)}
.g-phase{font-family:"Space Mono",monospace;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;
  color:#CFE0EC;margin-top:8px}
.g-cmd{display:flex;gap:8px;margin-top:16px}
.g-cmd button{padding:11px 22px;border-radius:999px;font-size:13.5px;font-weight:600;
  background:rgba(255,255,255,.14);color:#fff}
.g-cmd .g-pause.on{background:var(--ambre);color:var(--encre)}
.g-cmd .g-stop{background:rgba(169,59,44,.30);color:#FFC4BA}
.g-bas{display:flex;gap:8px;margin-top:26px}
.g-bas button{padding:11px 17px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-size:13.5px}
.g-son[aria-pressed=false]{background:rgba(255,255,255,.04);color:#8FA6BB}

/* ---------- repas ---------- */
.meal-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.meal-h .lbl{font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ambre)}
.meal-h .kc{font-family:"Space Mono",monospace;font-size:12px;color:var(--encre2)}
.meal-n{font-weight:600;font-size:15.5px;line-height:1.3;margin-bottom:8px}
.ing{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:3px 0;color:var(--encre2)}
.ing .q{font-family:"Space Mono",monospace;color:var(--encre);white-space:nowrap}
.ing .q.q-eq{cursor:pointer;border-bottom:1px dashed var(--encre3);padding-bottom:1px}
.eq-exact{font-family:"Space Mono",monospace;font-size:14px;color:var(--encre2);margin:-6px 0 14px}
.eq-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.eq-row{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:17px;
  background:var(--sable);border:1px solid var(--trait);border-radius:12px;padding:12px 14px}
.eq-astuce{font-size:12px;color:var(--encre3);margin:2px 0 10px;line-height:1.4}
.note{font-size:12.5px;color:var(--encre2);background:var(--sable);border-radius:8px;padding:9px 11px;margin-top:10px;line-height:1.45}

.jeune-chip{padding:4px 9px;border:1px solid var(--trait);border-radius:999px;font-size:10.5px;
  font-family:"Space Mono",monospace;letter-spacing:.02em;color:var(--encre2);background:#fff;
  white-space:nowrap;flex:none}
.jeune-chip.on{background:var(--encre);border-color:var(--encre);color:#fff}
.card.meal-off{background:var(--sable);box-shadow:none}

.jeune-chip.valide.on{background:var(--teal);border-color:var(--teal);color:#fff}
.ic-wrap{position:relative;display:inline-flex}
.pastille{position:absolute;top:-5px;right:-9px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;
  background:var(--rouge);color:#fff;font-family:"Space Mono",monospace;font-size:9.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;line-height:1}

.sheet-ov{position:fixed;inset:0;z-index:150;background:rgba(22,40,60,.55);
  display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(22,40,60,.2)}
.sheet-nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;
  letter-spacing:-.01em;margin:6px 0 14px}
.sheet-in{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sheet-in input{flex:1;padding:14px 14px;font-size:19px;font-family:"Space Mono",monospace;
  border:1px solid var(--trait);border-radius:12px}
.sheet-in span{font-family:"Space Mono",monospace;font-size:14px;color:var(--encre2);min-width:48px}
.sheet .cta{margin-bottom:8px}

.ic-r{width:19px;height:19px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rule .m{display:flex;align-items:center;justify-content:center;width:24px}
.cle{color:var(--teal);font-weight:600}
.cle-a{color:var(--jaune-fort);font-weight:600}
.lien-danger{display:block;width:100%;text-align:center;margin-top:14px;font-size:12.5px;
  color:var(--encre3);text-decoration:underline;text-underline-offset:3px;padding:6px}
.lien-danger:active{color:var(--rouge)}
.lien-infos{display:inline-block;margin-top:12px;font-size:12.5px;font-weight:600;color:var(--teal);
  border-bottom:1px solid var(--teal);padding:0 0 1px;line-height:1.2}
.lien-infos::before{content:"ⓘ";margin-right:6px;font-weight:400}

/* ---------- guide ---------- */

/* ============================================================
   STOCKAGE — window.storage (artefact) → localStorage → mémoire
   ============================================================ */
const Store = (()=>{
  const mem = {};
  const hasWin = typeof window!=='undefined' && window.storage && typeof window.storage.get==='function';
  let hasLS=false;
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); hasLS=true; }catch(e){}
  return {
    persistant: hasWin || hasLS,
    async get(k){
      if(hasWin){ try{ const r=await window.storage.get(k); return r? r.value:null; }catch(e){ return null; } }
      if(hasLS){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
      return mem[k] ?? null;
    },
    async set(k,v){
      if(hasWin){ try{ await window.storage.set(k,v); return; }catch(e){} }
      if(hasLS){ try{ localStorage.setItem(k,v); return; }catch(e){} }
      mem[k]=v;
    },
    async del(k){
      if(hasWin){ try{ await window.storage.delete(k); return; }catch(e){} }
      if(hasLS){ try{ localStorage.removeItem(k); return; }catch(e){} }
      delete mem[k];
    }
  };
})();

/* ============================================================
   CALCULS PHYSIOLOGIQUES
   ============================================================ */
const FACT_ACT = { sedentaire:1.35, debout:1.50, actif:1.65, sportif:1.80 };
const LBL_ACT = { sedentaire:'Assis la journée', debout:'Debout / en mouvement', actif:'Actif, beaucoup de marche', sportif:'Métier physique' };
const RYTHME = { doux:0.0035, standard:0.0055, soutenu:0.0070 };
const LBL_RYT = { doux:'Douce', standard:'Standard', soutenu:'Soutenue' };

function calculs(p){
  const bmr = p.sexe==='h'
    ? 10*p.poids + 6.25*p.taille - 5*p.age + 5
    : 10*p.poids + 6.25*p.taille - 5*p.age - 161;
  const tdee = bmr * FACT_ACT[p.activite];
  const perteSem = p.poids * RYTHME[p.rythme];          // kg/semaine
  let deficit = perteSem * 7700 / 7;                     // kcal/jour
  const plancher = Math.max(p.sexe==='h'?1500:1300, bmr*1.05);
  let cible = tdee - deficit;
  let brid = false;
  if(cible < plancher){ cible = plancher; deficit = tdee - cible; brid = true; }
  cible = Math.round(cible/10)*10;
  const prot = Math.round(p.poids*1.9);
  const lip  = Math.round(p.poids*0.9);
  const glu  = Math.max(60, Math.round((cible - prot*4 - lip*9)/4));
  const fibres = Math.round(cible/1000*14);
  const eau = (p.poids*0.033).toFixed(1);
  const perteReelle = deficit*7/7700;
  const pas = p.activite==='sedentaire'?9000:p.activite==='debout'?10000:11000;
  return {
    bmr:Math.round(bmr), tdee:Math.round(tdee), cible, deficit:Math.round(deficit),
    prot, lip, glu, fibres, eau, brid, plancher:Math.round(plancher),
    perteSem:perteReelle, projection: (p.poids - perteReelle*12).toFixed(1), pas
  };
}

function semaineCourante(){
  const d0 = new Date(P.depart+'T00:00:00');
  const diff = Math.floor((Date.now()-d0.getTime())/86400000);
  return Math.min(12, Math.max(1, Math.floor(diff/7)+1));
}
function phase(){
  const s = semaineCourante();
  if(s<=4) return {n:1, nom:'Fondations', txt:"Priorité à la respiration et au vacuum. Aucun exercice de flexion lestée. On apprend à contenir la pression avant de la charger."};
  if(s<=8) return {n:2, nom:'Charge', txt:"Tenues allongées, résistance au Pallof, roue abdominale à genoux en amplitude partielle — en surveillant le bombement."};
  return {n:3, nom:'Définition', txt:"Amplitude complète à la roue, hollow rocks, une séance de cardio en plus. Ne pas creuser le déficit maintenant : c'est là qu'on perd du muscle."};
}

// choisit le nom de l'exercice selon le matériel, et renvoie l'accessoire retenu
// L'ordre des clés de `acc` fixe la préférence propre à l'exercice : une barre de
// traction prime sur une haltère pour un tirage vertical, l'inverse pour un rowing.
function nomEx(e){
  if(P.equip === 'salle') return {nm:e.salle, id:'salle'};
  if(P.equip === 'pdc')   return {nm:e.pdc,   id:'pdc'};
  if(e.acc) for(const id of Object.keys(e.acc)) if(aDispo(id)) return {nm:e.acc[id], id};
  return {nm:e.pdc, id:'pdc'};
}
function choisirVariante(map){
  if(!map) return null;
  if(P.equip === 'accessoires'){
    for(const id of Object.keys(map)) if(id !== 'pdc' && aDispo(id)) return map[id];
    return map.pdc || null;
  }
  return map[P.equip] || null;
}

// lien vers une recherche YouTube — plus robuste qu'un identifiant de vidéo,
// qui peut être supprimé ou renommé par sa chaîne
function lienVideo(nom){
  let n = nom.replace(/\([^)]*\)/g,'');
  const parts = n.split(',');
  if(parts.length > 1) n = parts.filter(x=>!/\d/.test(x)).join(' ') || parts[0];
  if(!n.trim()) n = nom;
  const q = n.replace(/\s+/g,' ').trim() + ' technique exercice';
  return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
}

// le cardio profite aussi des accessoires disponibles
function cardioEx(min){
  if(P.equip==='accessoires' && aDispo('trampoline'))
    return {nm:'Rebonds sur trampoline', sr:min+' min', tip:'Impact très faible pour les articulations, et l\'allure reste conversationnelle. Alterne rebonds simples et montées de genoux.'};
  if(P.equip==='accessoires' && aDispo('corde'))
    return {nm:'Corde à sauter, intervalles souples', sr:min+' min', tip:'30 s de saut, 30 s de marche. Reste en zone conversationnelle : ce n\'est pas une séance de HIIT.'};
  return {nm:'Marche rapide, vélo ou rameur', sr:min+' min', tip:'Allure où tu peux encore tenir une conversation. Le nez suffit à respirer.'};

/* ============================================================
   CONSTRUCTION DE LA SEMAINE
   ============================================================ */
function buildSemaine(){
  const dispo = P.dispo.map((d,i)=>({...d, i}));
  const longs = dispo.filter(d=>d.on && d.minutes>=40);
  const courts = dispo.filter(d=>d.on && d.minutes<40);

  // choisir les jours de musculation, les plus espacés possible
  let muscuJours = [];
  if(longs.length>=4) muscuJours = [longs[0], longs[Math.floor(longs.length/2)], longs[longs.length-1]];
  else if(longs.length===3) muscuJours = [...longs];
  else if(longs.length===2) muscuJours = [...longs];
  else if(longs.length===1) muscuJours = [...longs];
  muscuJours = [...new Set(muscuJours.map(d=>d.i))].map(i=>dispo[i]);

  const lettres = muscuJours.length>=3 ? ['A','B','C'] : muscuJours.length===2 ? ['A','B'] : ['A'];
  const plan = JOURS.map((nom,i)=>({jour:nom, court:JOURS_C[i], i, blocs:[], creneau:dispo[i].creneau, minutes:dispo[i].minutes, on:dispo[i].on}));

  let coreRestants = ['A','B'];
  muscuJours.forEach((d,k)=>{
    const L = lettres[k % lettres.length];
    const bloc = {type:'muscu', titre:MUSCU[L].nom, ex:MUSCU[L].ex.map(key=>{
      const e = EX[key], r = nomEx(e); return {nm:r.nm, sr:e.sr, tip:e.tip, mw:lienMW(key, r.id)};
    })};
    if(d.minutes<45) bloc.ex = bloc.ex.slice(0,4);
    plan[d.i].blocs.push(bloc);
    if(d.minutes>=55 && coreRestants.length){
      const c = coreRestants.shift();
      plan[d.i].blocs.push({type:'core', titre:CORE[c].nom, ex:CORE[c].items.map(exGainage)});
    }
  });

  // jours restants : gainage manquant, puis cardio
  const restants = dispo.filter(d=>d.on && !muscuJours.some(m=>m.i===d.i));
  let cardioMis = 0;
  const cardioCible = phase().n===3 ? 2 : 1;
  restants.forEach(d=>{
    if(coreRestants.length && d.minutes>=25){
      const c = coreRestants.shift();
      plan[d.i].blocs.push({type:'core', titre:CORE[c].nom, ex:CORE[c].items.map(exGainage)});
      if(d.minutes>=40){ plan[d.i].blocs.push({type:'cardio', titre:'Cardio zone 2 — '+(d.minutes-20)+' min', ex:[cardioEx(d.minutes-20)]}); cardioMis++; }
    } else if(cardioMis<cardioCible && d.minutes>=25){
      plan[d.i].blocs.push({type:'cardio', titre:'Cardio zone 2 — '+d.minutes+' min', ex:[cardioEx(d.minutes)]});
      cardioMis++;
    } else if(d.minutes>=20){
      plan[d.i].blocs.push({type:'mob', titre:MOBILITE.nom, ex:MOBILITE.items.map(exGainage)});
    }
  });
  // gainage restant : le glisser sur un jour de musculation court
  coreRestants.forEach(c=>{
    const cible = muscuJours[muscuJours.length-1] || dispo.find(d=>d.on);
    if(cible) plan[cible.i].blocs.push({type:'core', titre:CORE[c].nom+' (à enchaîner)', ex:CORE[c].items.map(exGainage)});
  });
  return plan;
}

/* ---------- saisonnalité ----------
   Calendrier indicatif France (mois 1–12) des fruits et légumes cultivés
   localement. Ce qui n'est pas listé (carotte, pomme de terre) est
   disponible quasi toute l'année ; les produits importés hors-saison
   locale (banane, citron, avocat, olives) ne sont pas contraints. */
const SAISON = {
  'tomate':        [6,7,8,9],
  'courgette':     [5,6,7,8,9],
  'aubergine':     [6,7,8,9],
  'concombre':     [5,6,7,8,9],
  'brocoli':       [6,7,8,9,10,11],
  'haricots verts':[6,7,8,9],
  'épinard':       [1,2,3,4,5,9,10,11,12],   // monte en graine l'été
  'fenouil':       [6,7,8,9,10],
  'mâche':         [9,10,11,12,1,2,3],
  'pak choï':      [4,5,9,10,11],
  'ratatouille':   [6,7,8,9],                // mélange de légumes d'été
  'patate douce':  [9,10,11,12,1,2],
  'fraise':        [5,6,7],
  'framboise':     [6,7,8,9],
  'myrtille':      [7,8,9],
  'orange':        [11,12,1,2,3,4],
  'kiwi':          [11,12,1,2,3,4,5]
};
const MOIS_NOM = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function estDeSaison(m, mois){
  return m.ing.every(([nm])=>{
    const l = nm.toLowerCase();
    for(const k in SAISON){ if(l.indexOf(k) >= 0) return SAISON[k].indexOf(mois) >= 0; }
    return true;
  });
}

function filtreRepas(liste, soir){
  const r = P.regime||[];
  const a = (m,t) => m.tags.indexOf(t) >= 0;
  let out = liste.filter(m=>{
    if(r.includes('sansViande')  && a(m,'viande')) return false;
    if(r.includes('sansPoisson') && a(m,'poisson')) return false;
    if(r.includes('vegetarien')  && (a(m,'viande')||a(m,'poisson'))) return false;
    if(r.includes('vegan')       && (a(m,'viande')||a(m,'poisson')||a(m,'lactose')||a(m,'oeuf'))) return false;
    // Cacher : pas de porc, pas de crustacé ni de poisson sans écailles,
    // et jamais viande et produit laitier dans le même repas.
    if(r.includes('cacher') && (a(m,'porc') || a(m,'sansEcailles') || (a(m,'viande') && a(m,'lactose')))) return false;
    // Halal : pas de porc ni d'alcool. Les crustacés sont écartés par prudence,
    // l'école hanafite ne les autorisant pas là où les autres écoles les admettent.
    if(r.includes('halal') && (a(m,'porc') || a(m,'alcool') || a(m,'sansEcailles'))) return false;
    if(r.includes('sansLactose') && a(m,'lactose')) return false;
    if(r.includes('sansGluten')  && a(m,'gluten')) return false;
    return true;
  });
  // Privilégie les recettes de saison, en gardant assez de choix pour la variété.
  if(P.saison !== false){
    const mois = new Date().getMonth() + 1;
    const s = out.filter(m=>estDeSaison(m, mois));
    if(s.length >= 3) out = s;
  }
  if(soir){
    const calmes = out.filter(m=>m.calme);
    if(calmes.length>=3) out = calmes;
  }
  return out.length ? out : liste;
}

// Générateur reproductible. L'ancien était un LCG à petits coefficients :
// pour des graines consécutives, les premiers tirages décroissaient linéairement,
// ce qui figeait le même plat plusieurs jours d'affilée.
function rng(seed){
  let s = seed >>> 0;
  s = Math.imul(s ^ 0x9e3779b9, 0x85ebca6b) >>> 0;
  s ^= s >>> 13; s = Math.imul(s, 0xc2b2ae35) >>> 0; s ^= s >>> 16;
  return function(){
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function empreinte(txt){ let h = 2166136261; for(let i=0;i<txt.length;i++){ h ^= txt.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

// Tirage sans répétition : chaque plat sort une fois par cycle, l'ordre étant
// rebattu à chaque nouveau tour de liste. Variété garantie, jamais deux fois de suite.
function pioche(liste, cle, idx){
  const n = liste.length;
  if(n <= 1) return liste[0];
  const tour = Math.floor(idx / n);
  const r = rng(empreinte(cle) + tour*7919 + menuSeed*104729);
  const ordre = liste.map((_,i)=>i);
  for(let i=n-1;i>0;i--){ const j = Math.floor(r()*(i+1)); const t=ordre[i]; ordre[i]=ordre[j]; ordre[j]=t; }
  return liste[ordre[idx % n]];
}

const PART  = {pdj:.25, col:.12, dej:.35, din:.28};
const SLOTS = [['pdj','Petit-déjeuner',false],['col','Collation',false],['dej','Déjeuner',false],['din','Dîner',true]];
const SCALE_MIN = .6, SCALE_MAX = 2.0;

function menuDuJour(idx){
  const c = calculs(P);
  const J = P.jeune || {};

  // tirage des plats (fait pour tous, même jeûnés, pour garder le tirage stable)
  const out = SLOTS.map(([k,lbl,soir])=>{
    const l = filtreRepas(REPAS[k], soir);
    return {key:k, lbl, m:pioche(l, k+'|'+(P.regime||[]).join(','), idx), scale:0, jeune:!!J[k]};
  });

  const actifs = out.filter(o=>!o.jeune);
  const somme  = actifs.reduce((t,o)=>t+PART[o.key],0);

  if(somme>0){
    // répartition initiale : la part du repas jeûné est redistribuée au prorata
    actifs.forEach(o=>{
      const vise = c.cible * (PART[o.key]/somme);
      o.scale = Math.min(SCALE_MAX, Math.max(SCALE_MIN, vise/o.m.kcal));
    });
    // deux passes pour absorber le reliquat dans la marge encore disponible
    for(let i=0;i<2;i++){
      const tot = actifs.reduce((t,o)=>t+o.m.kcal*o.scale,0);
      const reste = c.cible - tot;
      if(Math.abs(reste) < 5) break;
      const marges = actifs.map(o=>({o, m: reste>0 ? (SCALE_MAX-o.scale)*o.m.kcal
                                                   : (o.scale-SCALE_MIN)*o.m.kcal}));
      const totalMarge = marges.reduce((t,x)=>t+x.m,0);
      if(totalMarge <= 0.5) break;
      marges.forEach(x=>{ x.o.scale += (reste*(x.m/totalMarge))/x.o.m.kcal; });
    }
  }

  const tot  = Math.round(out.reduce((t,o)=>t+o.m.kcal*o.scale,0));
  const prot = Math.round(out.reduce((t,o)=>t+o.m.p*o.scale,0));
  return {out, tot, prot, cible:c, nbJeune: out.length-actifs.length, manque: c.cible-tot};
}

function qte(base, scale, unit){
  const v = base*scale;
  if(unit==='u') return (Math.round(v*2)/2).toString().replace('.5',' ½').replace(/^0 ½$/,'½') + ' ';
  if(unit==='pincée') return '1 ';
  if(v>=40) return Math.round(v/5)*5 + ' ';
  return Math.round(v) + ' ';
}

function drawTape(){
  const svg = document.getElementById('tape');
  const W=360, H=44, pad=6;
  const sem = P ? semaineCourante() : 1;
  let s = `<line class="base" x1="0" y1="${H-9}" x2="${W}" y2="${H-9}"/>`;
  for(let i=0;i<=48;i++){
    const x = pad + (W-2*pad)*i/48;
    const maj = i%4===0;
    const h = maj? 20 : (i%2===0?12:7);
    s += `<line class="${maj?'maj':'min'}" x1="${x.toFixed(1)}" y1="${H-9}" x2="${x.toFixed(1)}" y2="${(H-9-h).toFixed(1)}"/>`;
    if(maj && i<48){
      const wk = i/4+1;
      const cx = pad + (W-2*pad)*(i+2)/48;
      s += `<text class="num ${wk===sem?'on':''}" x="${cx.toFixed(1)}" y="${H-1}" text-anchor="middle">${wk}</text>`;
    }
  }
  const cx = pad + (W-2*pad)*((sem-1)*4+2)/48;
  s += `<polygon class="cur" points="${cx-5},4 ${cx+5},4 ${cx},13"/>`;
  svg.innerHTML = s;
}

// Répartit la cible hydrique en verres de 250 ml sur des moments fixes.
// Rien après 20 h : boire tard fragmente le sommeil, et le sommeil pèse
// plus lourd sur un déficit que le litre supplémentaire.
const VERRE = 250;
function hydratation(litres, creneau){
  const verres = Math.max(6, Math.round(litres*1000/VERRE));
  const pts = [
    {min:385, t:'6 h 25',  q:'Au réveil',                n:1},
    {min:475, t:'7 h 55',  q:'Avant le petit-déjeuner',  n:1},
    {min:630, t:'10 h 30', q:'Milieu de matinée',        n:1},
    {min:780, t:'13 h 00', q:'Avant le déjeuner',        n:1},
    {min:900, t:'15 h 00', q:'Milieu d\'après-midi',     n:1},
    {min:988, t:'16 h 28', q:'Avec la collation',        n:1},
    {min:1080,t:'18 h 00', q:'Fin d\'après-midi',        n:1},
    {min:1200,t:'20 h 00', q:'Avant le dîner',           n:1}
  ];
  const H = {matin:{min:415,t:'6 h 55'}, midi:{min:745,t:'12 h 25'}, soir:{min:1165,t:'19 h 25'}};
  if(creneau && H[creneau]) pts.push({...H[creneau], q:'Autour de la séance', n:1});
  pts.sort((a,b)=>a.min-b.min);
  let reste = verres - pts.reduce((s,p)=>s+p.n, 0);
  const ordre = [0,3,5,2,7,1,4,6];
  for(let i=0; reste>0; i++, reste--) pts[ordre[i%ordre.length] % pts.length].n++;
  return pts;
}

const RAYONS = [
  ['Viandes et poissons', ['poulet','dinde','bœuf','saumon','cabillaud','colin','truite','poisson','thon','crevettes','maquereau']],
  ['Œufs et produits laitiers', ['œuf','skyr','yaourt','fromage blanc','lait','feta','whey']],

  ['Féculents et céréales', ['riz','quinoa','avoine','pain','épeautre','boulgour','semoule','nouilles','polenta','maïs','pomme de terre','pommes de terre','patate douce','tortilla','galettes']],
  ['Fruits et légumes', ['brocoli','aubergine','courgette','épinard','haricots verts','carotte','tomate','concombre','mâche','pak choï','ratatouille','fenouil','myrtille','fraise','framboise','orange','kiwi','banane','citron','avocat','olives']],
  ['Épicerie', []]
];
const HORS_LISTE = ['eau','cannelle','curcuma','sel','poivre','épices'];   // pas achetés au poids
function surLaListe(nm){ const l = nm.toLowerCase().trim(); return !HORS_LISTE.some(x=>l===x); }
function rayon(nm){
  const l = nm.toLowerCase();
  for(let i=0;i<RAYONS.length-1;i++) if(RAYONS[i][1].some(m=>l.indexOf(m)>=0)) return i;
  return RAYONS.length-1;
}
function qteCourse(q,u){
  if(u==='u') return Math.ceil(q-0.15) + (Math.ceil(q-0.15)>1?' unités':' unité');
  if(u==='ml') return q>=1000 ? (q/1000).toFixed(1).replace('.',',')+' L' : Math.round(q/10)*10+' ml';
  if(q>=1000) return (q/1000).toFixed(1).replace('.',',')+' kg';
  if(q>=100)  return Math.round(q/10)*10+' g';
  return Math.round(q/5)*5+' g';
}

const DUREES = [[0,"Aujourd'hui"],[7,'1 sem.'],[14,'2 sem.'],[21,'3 sem.'],[30,'1 mois']];

/* ============================================================
   INVENTAIRE
   Ce qu'on a acheté (poids réel) moins ce qu'on a consommé
   à chaque repas validé. Alerte quand il reste moins de 3 jours.
   ============================================================ */
const SEUIL_JOURS = 3;

function cleRepas(jour, key){
  const d = new Date(); d.setDate(d.getDate() + ((jour - (new Date().getDay()+6)%7) + 7) % 7);
  return d.toISOString().slice(0,10) + '|' + key;
}
function estValide(jour, key){ return !!((P.valides||{})[cleRepas(jour,key)]); }

function stock(){ return (P.inventaire = P.inventaire || {}); }
function cleIng(nm,u){ return nm+'|'+u; }

// consommation quotidienne moyenne, calculée sur la semaine affichée
function consoJour(){
  const c = {};
  for(let i=0;i<7;i++) menuDuJour(i).out.forEach(o=>{
    if(o.jeune) return;
    ingredients(o.m).forEach(([nm,q,u])=>{
      if(u==='pincée' || !surLaListe(nm)) return;
      const k = cleIng(nm,u);
      c[k] = (c[k]||0) + q*o.scale/7;
    });
  });
  return c;
}
// aliments en stock qui tiendront moins de SEUIL_JOURS jours
function bientotEpuise(){
  // ne concerne que ce qu'on suit réellement : un aliment jamais acheté n'est pas « en rupture »
  const inv = stock(), conso = consoJour(), out = [];
  Object.keys(inv).forEach(k=>{
    const c = conso[k];
    if(!c || c <= 0) return;                    // plus au menu : pas d'alerte
    const jours = inv[k]/c;
    if(jours < SEUIL_JOURS) out.push({k, nm:k.split('|')[0], u:k.split('|')[1], reste:inv[k], jours});
  });
  return out.sort((a,b)=>a.jours-b.jours);
}
function retireDuStock(o){
  const inv = stock();
  ingredients(o.m).forEach(([nm,q,u])=>{
    if(u==='pincée' || !surLaListe(nm)) return;
    const k = cleIng(nm,u);
    if(inv[k] === undefined) return;                 // non suivi : on ne crée pas de dette
    inv[k] = Math.max(0, inv[k] - q*o.scale);   // on garde le zéro : c'est lui qui déclenche l'alerte
  });
}

function spark(vals,color){
  const W=320,H=100,pad=14;
  const min=Math.min(...vals), max=Math.max(...vals);
  const span = (max-min)||1;
  const pts = vals.map((v,i)=>{
    const x = pad + (W-2*pad)*(vals.length>1? i/(vals.length-1):0.5);
    const y = pad + (H-2*pad)*(1-(v-min)/span);
    return [x,y];
  });
  const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="margin-top:8px">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${color}"/>`).join('')}
    <text x="${pad}" y="${H-2}" font-family="Space Mono, monospace" font-size="9" fill="#7D8FA0">${min.toFixed(1)}</text>
    <text x="${W-pad}" y="12" text-anchor="end" font-family="Space Mono, monospace" font-size="9" fill="#7D8FA0">${max.toFixed(1)}</text>
  </svg>`;
}

/* ---------- équivalences ménagères ----------
   Peser chaque aliment est contraignant. En touchant un poids, on
   propose des repères approximatifs — cuillères, poignées, verres,
   paume de la main — pour estimer sans balance. Volontairement
   indicatifs : l'à-peu-près réellement suivi vaut mieux que la
   pesée exacte qu'on finit par abandonner. */
const MESURE = {
  cs:      {u:'c. à soupe',       p:'c. à soupe'},
  cc:      {u:'c. à café',        p:'c. à café'},
  verre:   {u:'verre',            p:'verres'},
  poignee: {u:'poignée',          p:'poignées'},
  paume:   {u:'paume de la main', p:'paumes de la main'},
  carre:   {u:'carré',            p:'carrés'},
  tranche: {u:'tranche',          p:'tranches'}
};
// Pour chaque famille d'aliment : [clé de mesure, grammes (ou ml) pour UNE mesure].
const REPERES = {
  huile:      [['cs',13],['cc',4.5]],
  pate:       [['cs',16],['cc',5.5]],
  poudre:     [['cs',8],['cc',3]],
  laitage:    [['verre',150],['cs',20]],
  graines:    [['cs',10],['cc',3.5]],
  oleagineux: [['poignee',30],['cs',12]],
  flocons:    [['poignee',25],['cs',10]],
  cereale:    [['poignee',40],['cs',18]],
  baies:      [['poignee',40],['cs',15]],
  feuilles:   [['poignee',25]],
  olives:     [['cs',12],['cc',4]],
  fromage:    [['cs',15]],
  proteine:   [['paume',110]],      // pièce ferme (filet, blanc, pavé, steak)
  proteine_molle: [['poignee',50]], // émietté / haché / cubes (thon, crevettes, tofu…) : la paume ne convient pas
  chocolat:   [['carre',5]],
  pain:       [['tranche',30]],
  liquide:    [['verre',200],['cs',15]],
  legume:     [['poignee',80]]
};
// Aliments qui se comptent à la pièce : au-delà d'une certaine quantité, un
// décompte en poignées n'a plus de sens (« 9 poignées de brocolis ») ; on parle
// alors en nombre d'éléments (« 2 brocolis »). [mots-clés, grammes d'UNE pièce, singulier, pluriel].
const PIECES = [
  {mots:['brocoli'],                       g:250, u:'brocoli',        p:'brocolis'},
  {mots:['courgette'],                     g:200, u:'courgette',      p:'courgettes'},
  {mots:['aubergine'],                     g:250, u:'aubergine',      p:'aubergines'},
  {mots:['patate douce'],                  g:200, u:'patate douce',   p:'patates douces'},
  {mots:['pomme de terre','pommes de terre'], g:100, u:'pomme de terre', p:'pommes de terre'},
  {mots:['carotte'],                       g:70,  u:'carotte',        p:'carottes'},
  {mots:['tomate'],                        g:120, u:'tomate',         p:'tomates'},
  {mots:['concombre'],                     g:300, u:'concombre',      p:'concombres'},
  {mots:['fenouil'],                       g:250, u:'fenouil',        p:'fenouils'},
  {mots:['avocat'],                        g:120, u:'avocat',         p:'avocats'}
];
function pieceDe(nm, unite){
  if(unite !== 'g') return null;
  const s = (nm||'').toLowerCase();
  return PIECES.find(pc=>pc.mots.some(m=>s.indexOf(m) >= 0)) || null;
}
function categorieAliment(nm, unite){
  if(unite === 'ml') return 'liquide';
  const s = (nm||'').toLowerCase();
  const has = (...xs)=>xs.some(x=>s.indexOf(x) >= 0);
  if(has('huile')) return 'huile';
  if(has('beurre de cacahu','purée d','puree d')) return 'pate';
  if(has('whey','protéine','proteine','protein')) return 'poudre';
  if(has('skyr','fromage blanc','yaourt','fromage frais')) return 'laitage';
  if(has('graines','chia','sésame','sesame')) return 'graines';
  if(has('amande','noix','noisette','pécan','pecan','cajou')) return 'oleagineux';
  if(has('flocons','avoine')) return 'flocons';
  if(has('riz','quinoa','boulgour','semoule','polenta','lentille','nouille','pâtes','pates','couscous','épeautre','epeautre','maïs','mais')) return 'cereale';
  if(has('myrtille','fraise','framboise','mûre','mure','cassis','baie')) return 'baies';
  if(has('épinard','epinard','mâche','mache','roquette','salade','pak cho','cresson')) return 'feuilles';
  if(has('olive')) return 'olives';
  if(has('feta','parmesan','mozzarella','comté','comte','gruyère','gruyere')) return 'fromage';
  if(has('chocolat')) return 'chocolat';
  if(has('pain','tortilla','galette','tartine','biscotte')) return 'pain';
  // protéines non fermes (émiettées, hachées, en cubes) : pas de repère « paume »
  if(has('thon','crevette','haché','hache','émietté','emiette','tofu','tempeh')) return 'proteine_molle';
  if(has('poulet','dinde','bœuf','boeuf','steak','saumon','cabillaud','colin','truite','maquereau','poisson','viande','jambon','œuf','oeuf')) return 'proteine';
  return 'legume';
}
// Valeur réellement affichée pour x (entier ou demi), utilisée pour l'accord
// pluriel et pour juger si une mesure tombe « rond ».
function compteNum(x){
  if(x < 0.75) return 0.5;
  return x < 3 ? Math.round(x*2)/2 : Math.round(x);
}
function fmtCompte(x){
  if(x < 0.75) return '½';
  const r = x < 3 ? Math.round(x*2)/2 : Math.round(x);
  return r.toString().replace('.5',' ½');
}
// Renvoie UN seul repère, le plus simple à réaliser.
function equivMenages(nm, montant, unite){
  // Aliment qui se compte à la pièce : on parle en nombre d'éléments (« 2 carottes »)
  // plutôt qu'en poignées — plus clair, et jamais de décompte qui s'emballe.
  const pc = pieceDe(nm, unite);
  if(pc){
    const n = montant / pc.g;
    if(n >= 0.4) return [`≈ ${fmtCompte(n)} ${compteNum(n) >= 2 ? pc.p : pc.u}`];
  }
  const cat = categorieAliment(nm, unite);
  const reperes = REPERES[cat] || REPERES.legume;
  const cand = reperes.map(([cle, g])=>{
    const n = montant / g;
    const c = compteNum(n);
    const m = MESURE[cle];
    return { n, demi: (c % 1 !== 0), txt:`≈ ${fmtCompte(n)} ${c >= 2 ? m.p : m.u}` };
  });
  // On ne garde qu'un repère : priorité aux quantités entières (une demi-cuillère
  // est moins pratique qu'une cuillère pleine — ex. « 2 c. à café » plutôt que
  // « ½ c. à soupe »), puis au plus petit nombre d'unités.
  const dansPlage = cand.filter(x=>x.n >= 0.4 && x.n <= 12);
  const choix = (dansPlage.length ? dansPlage : cand)
    .sort((a,b)=> (a.demi - b.demi) || (a.n - b.n))[0];
  return choix ? [choix.txt] : [];
}
function ouvreEquiv(payload){
  if(document.querySelector('.sheet-ov')) return;   // une seule fiche à la fois
  const [gStr, unite, encnm] = payload.split('|');
  const nm = decodeURIComponent(encnm);
  const montant = parseFloat(gStr) || 0;
  const uAff = unite === 'ml' ? 'ml' : 'g';
  const eqs = equivMenages(nm, montant, unite);
  const el = document.createElement('div');
  el.className = 'sheet-ov';
  el.innerHTML = `
    <div class="sheet">
      <div class="eyebrow">Repères sans balance</div>
      <div class="sheet-nm">${nm}</div>
      <div class="eq-exact">Portion visée : ${Math.round(montant)} ${uAff}</div>
      <div class="eq-list">
        ${eqs.map(e=>`<div class="eq-row">${e}</div>`).join('')}
      </div>
      <div class="note" style="margin-top:0">Repères approximatifs, de quoi se passer de la balance au quotidien. Pour un suivi précis, la pesée reste plus juste.</div>
      <button class="cta ghost" data-sh="no">Fermer</button>
    </div>`;
  document.body.appendChild(el);
  el.addEventListener('click', (ev)=>{
    if(ev.target.closest('[data-sh]') || ev.target === el) el.remove();
  });
}

/* ============================================================
   GUIDE D'ENTRAÎNEMENT
   Tempo au métronome, disque respiratoire continu, séries et pauses,
   et le schéma du mouvement en fond, cadencé sur les répétitions.
   ============================================================ */
const COUL = {plein:'#2FA79E', vide:'#E0A33C', bloque:'#A93B2C', pause:'#5D7A93'};

function melange(a,b,t){
  t = Math.max(0, Math.min(1, t));
  const h = c => [1,3,5].map(i=>parseInt(c.substr(i,2),16));
  const [r1,g1,b1] = h(a), [r2,g2,b2] = h(b);
  const m = (x,y)=>Math.round(x+(y-x)*t).toString(16).padStart(2,'0');
  return '#'+m(r1,r2)+m(g1,g2)+m(b1,b2);
}
const doux = u => 0.5 - 0.5*Math.cos(Math.PI*Math.max(0,Math.min(1,u)));   // sinus : départ et arrivée sans à-coup

/* ---------- cycle respiratoire ----------
   Chaque phase porte son rayon de départ et d'arrivée : la continuité
   est garantie par construction, plus aucun saut entre deux phases.   */
function respiration(nom, an){
  const n = (nom||'').toLowerCase();
  if(n.includes('vacuum')){
    // les secondes prescrites décomptent le blocage poumons vides, pas l'expiration
    const tenue = (an && an.type==='duree' && an.duree) ? an.duree : 12;
    return {tenue:true, phases:[
      ['Expire à fond',        4,     1.00, 0.30, COUL.plein,  COUL.vide],
      ['Poumons vides — tiens', tenue, 0.30, 0.22, COUL.vide,   COUL.bloque],
      ['Inspire',              3,     0.22, 1.00, COUL.bloque, COUL.plein]]};
  }
  if(n.includes('respiration 90/90')) return {phases:[
    ['Inspire',            3, 0.30, 1.00, COUL.vide,  COUL.plein],
    ['Expire lentement',   5, 1.00, 0.30, COUL.plein, COUL.vide],
    ['Poumons vides',      2, 0.30, 0.30, COUL.vide,  COUL.vide]]};
  if(n.includes('respiration 360')) return {phases:[
    ['Inspire par les côtes', 4, 0.30, 1.00, COUL.vide,  COUL.plein],
    ['Expire',             6, 1.00, 0.30, COUL.plein, COUL.vide]]};
  if(n.includes('planche')||n.includes('hollow')||n.includes('copenhagen')||n.includes('carry')) return {phases:[
    ['Inspire',            3, 0.30, 1.00, COUL.vide,  COUL.plein],
    ['Expire — le ventre rentre', 4, 1.00, 0.30, COUL.plein, COUL.vide]]};
  return {phases:[
    ['Inspire',            3, 0.30, 1.00, COUL.vide,  COUL.plein],
    ['Expire sur l\'effort', 4, 1.00, 0.30, COUL.plein, COUL.vide]]};
}

/* ---------- lecture des séries ---------- */
function analyseSerie(sr){
  const t = (sr||'').replace(/\u2013|\u2014/g,'-');
  const series = +((t.match(/^\s*(\d+)\s*[×x]/)||[])[1] || 1);
  const mins   = t.match(/(\d+)(?:-(\d+))?\s*min/);
  const metres = t.match(/[×x]\s*(\d+)\s*m\b/);
  const secs   = t.match(/[×x]\s*(\d+)(?:-(\d+))?\s*s\b/);
  const cycles = t.match(/[×x]\s*(\d+)\s*cycle/);
  const reps   = t.match(/[×x]\s*(\d+)(?:-(\d+))?/);
  if(mins)   return {series:1, duree:(+mins[1])*60, type:'duree'};
  if(metres) return {series, duree:Math.round(+metres[1]*0.8), type:'duree'};  // portage : ~1,25 m/s
  if(secs)   return {series, duree:+(secs[2]||secs[1]), type:'duree'};
  if(cycles) return {series, reps:+cycles[1], type:'reps'};
  if(reps)   return {series, reps:+(reps[2]||reps[1]), type:'reps'};
  return {series:3, reps:10, type:'reps'};
}
// temps de récupération : plus la série est lourde et brève, plus la pause est longue
const GAINAGE = ['dead bug','bird dog','shoulder taps','reverse crunch','planche','hollow',
                 'copenhagen','pallof','renegade','superman','pont fessier','table inversée'];
// Les repos longs (2 à 3 min) maximisent l'hypertrophie quand on cherche la performance
// pure. Ici on travaille en déficit, à charges modérées et sur un créneau court : la
// priorité est de finir la séance. On raccourcit, et le bouton « Passer » permet
// d'enchaîner dès qu'on se sent prêt — l'auto-régulation vaut mieux qu'un chiffre fixe.
function pause(a, nom){
  const n = (nom||'').toLowerCase();
  if(n.includes('respiration')||n.includes('vacuum')||n.includes('étirement')) return 15;
  if(GAINAGE.some(g=>n.includes(g))) return a.type==='duree' && a.duree>=40 ? 45 : 40;
  if(a.type === 'duree') return a.duree >= 40 ? 45 : 40;
  if(a.reps <= 8)  return 120;
  if(a.reps <= 12) return 90;
  return 60;
}

const Guide = (()=>{
  let ctx=null, hote=null, raf=null, tempo=null, t0=0, cfg=null, an=null,
      liste=[], idx=0, son=true, phase=-1, fini=false, dernierBip=-1, gel=0;

  function bip(freq, dur, gain, type){
    if(!ctx || !son) return;
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq*2.6, t);
    o.frequency.exponentialRampToValueAtTime(freq, t+0.05);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t+dur+0.02);
  }
  function note(freq, dep, dur, gain){
    if(!ctx || !son) return;
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime+dep;
    o.type = 'triangle'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t+dur+0.05);
  }
  const victoire = ()=>[523,659,784,1047].forEach((f,i)=>note(f, i*0.13, 0.36, 0.22));

  const cycle = () => cfg.phases.reduce((s,p)=>s+p[1], 0);

  // Un cycle qui commence par une expiration suppose les poumons déjà pleins.
  // On intercale donc une inspiration avant la toute première expiration de chaque série.
  function amorce(){
    const p0 = cfg.phases[0];
    if(!/^expire/i.test(p0[0])) return null;
    return ['Inspire — prépare-toi', 3, 0.30, p0[2], COUL.vide, p0[4]];
  }
  function etatAmorce(t){
    const a = amorce();
    if(!a) return {nom:'', r:0.30, col:COUL.vide, reste:0};   // sécurité : pas d'amorce sur ce cycle
    const [nom, duree, r0, r1, c0, c1] = a;
    const k = doux(t/duree);
    return {nom, r: r0+(r1-r0)*k, col: melange(c0, c1, t/duree), reste: Math.ceil(duree-t)};
  }

  /* déroulé complet : série 1, pause, série 2, pause, série 3.
     Construit une seule fois par exercice : le recalculer à chaque image
     coûtait cher et exposait à un état incohérent en cours de transition. */
  let plan = null;
  function programme(){
    if(plan) return plan;
    const a = an, c = cycle();
    const am = amorce();
    const bloc = cfg.tenue ? c : (a.type==='duree' ? a.duree : a.reps*c);
    const amo = am ? am[1] : 0;
    const seq = [];
    for(let i=0;i<a.series;i++){
      seq.push({genre:'serie', n:i+1, duree:bloc+amo, amo});
      if(i < a.series-1){
        const d = pause(a, liste[idx].nm);
        seq.push({genre:'pause', n:i+1, duree:d, phases:phasesPause(d, finDeSerie())});
      }
    }
    plan = seq;
    return seq;
  }
  function position(sec){
    const seq = programme();
    let t = sec;
    for(const e of seq){
      if(t < e.duree) return {...e, t, seq};
      t -= e.duree;
    }
    return {genre:'fini', t:0, seq};
  }

  function etatPhases(ph, t){
    let u = Math.max(0, t), i = 0;
    while(i < ph.length-1 && u >= ph[i][1]){ u -= ph[i][1]; i++; }
    const [nom, duree, r0, r1, c0, c1] = ph[i];
    u = Math.min(u, duree);
    const k = doux(u/duree);
    return {nom, r: r0+(r1-r0)*k, col: melange(c0, c1, u/duree), reste: Math.ceil(duree-u), i};
  }
  const etatSouffle = t => etatPhases(cfg.phases, t % cycle());

  // Volume pulmonaire et couleur à l'instant précis où la série se termine :
  // la récupération doit repartir de là, sans rupture.
  function finDeSerie(){
    const bloc = cfg.tenue ? cycle() : (an.type==='duree' ? an.duree : an.reps*cycle());
    return etatSouffle(Math.max(0, bloc - 0.001));
  }

  // Récupération : on souffle d'abord, puis respiration lente 4 s / 6 s.
  // L'expiration plus longue que l'inspiration est ce qui fait redescendre le rythme cardiaque.
  function phasesPause(duree, e0){
    const P0 = COUL.pause;
    const ph = [['Souffle — relâche', 4, e0.r, 0.30, e0.col, P0]];
    let reste = Math.max(0, duree - 4);
    while(reste >= 10){
      ph.push(['Récupération — inspire', 4, 0.30, 0.80, P0, P0]);
      ph.push(['Récupération — expire',  6, 0.80, 0.30, P0, P0]);
      reste -= 10;
    }
    if(reste >= 2){
      const i = Math.max(1, Math.round(reste*0.4));
      ph.push(['Récupération — inspire', i, 0.30, 0.70, P0, P0]);
      ph.push(['Récupération — expire',  Math.max(1, reste-i), 0.70, 0.30, P0, P0]);
    } else if(reste > 0){
      ph[ph.length-1][1] += reste;              // on absorbe le reliquat sur la dernière expiration
    }
    return ph;
  }

  function image(now){
    if(!hote){ raf = null; return; }                      // le guide a été fermé entre deux images
    if(gel){ raf = requestAnimationFrame(image); return; }
    try{ dessineImage(now); }
    catch(err){
      console.error('Guide :', err);
      q2('.g-phase', 'Reprise…'); plan = null; t0 = performance.now();
    }
    raf = requestAnimationFrame(image);
  }
  const q2 = (sel,v)=>{ const el = hote && hote.querySelector(sel); if(el) el.textContent = v; };

  function dessineImage(now){
    const sec = (now - t0)/1000;
    const p = position(sec);
    const q = (sel,v)=>{ const el=hote.querySelector(sel); if(el) el.textContent=v; };

    if(p.genre === 'fini'){
      if(!fini){ fini = true; victoire(); if(tempo){clearInterval(tempo); tempo=null;} }
      hote.querySelector('.g-cercle').setAttribute('r', 40);
      hote.querySelector('.g-cercle').setAttribute('fill', COUL.plein);
      hote.querySelector('.g-halo').setAttribute('r', 47);
      hote.querySelector('.g-halo').setAttribute('stroke', COUL.plein);
      q('.g-compte',''); q('.g-phase','Exercice terminé'); q('.g-serie','');
      return;
    }

    let R, col, label, compte;
    hote.querySelector('.g-passer').style.display = (p.genre === 'pause') ? '' : 'none';
    if(p.genre === 'pause'){
      const reste = Math.ceil(p.duree - p.t);
      const e = etatPhases(p.phases, p.t);
      R = 8 + e.r*54;
      col = e.col;
      label = e.nom;
      compte = reste;
      q('.g-serie', 'Série ' + (p.n||'') + ' terminée · repos ' + p.duree + ' s');
      const s = Math.floor(p.t);
      if(s !== dernierBip){ dernierBip = s; if(reste<=3) bip(880,.10,.20,'square'); else if(s%2===0) bip(220,.09,.10); }
    } else if(p.t < (p.amo||0)){
      const e = etatAmorce(p.t);
      R = 8 + e.r*54; col = e.col; label = e.nom; compte = e.reste;
      q('.g-serie', 'Série ' + p.n + ' / ' + an.series + ' · mise en place');
      if(phase !== -2){ phase = -2; bip(440,.12,.16); }
      if(fond) fond(0);
    } else {
      const tt = p.t - (p.amo||0);
      const e = etatSouffle(tt);
      R = 8 + e.r*54; col = e.col; label = e.nom; compte = e.reste;
      const rep = an.type==='duree' ? null : Math.min(an.reps, Math.floor(tt/cycle())+1);
      q('.g-serie', 'Série ' + p.n + ' / ' + an.series
        + (cfg.tenue ? ' · maintien ' + cfg.phases[1][1] + ' s'
        : rep ? ' · répétition ' + rep + ' / ' + an.reps
              : ' · ' + Math.ceil(p.duree-p.t) + ' s restantes'));
      if(e.i !== phase){ phase = e.i; bip(330,.12,.16); }
      // schéma de fond calé sur la répétition en cours
      if(fond) fond(an.type==='duree' ? (tt/cycle())%1 : (tt%cycle())/cycle());
    }
    hote.querySelector('.g-cercle').setAttribute('r', R.toFixed(1));
    hote.querySelector('.g-cercle').setAttribute('fill', col);
    hote.querySelector('.g-halo').setAttribute('r', (R+7).toFixed(1));
    hote.querySelector('.g-halo').setAttribute('stroke', col);
    q('.g-compte', compte); q('.g-phase', label);
  }

  /* ---------- schéma du mouvement en fond ---------- */
  let fond = null;
  function prepareFond(e){
    const zone = hote.querySelector('.g-fond');
    zone.innerHTML = ''; fond = null;
    const M = window.Mouvements;
    if(!M || !e.anim || !M.MOUV[e.anim]) return;
    const m = M.MOUV[e.anim];
    M.limiteSol(m);
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox', m.vue.join(' '));
    svg.setAttribute('class','g-fond-svg');
    zone.appendChild(svg);
    fond = (u)=>{
      const {p} = M.poseA(m, u);
      svg.innerHTML = (m.sol!==undefined && m.sol!==null
        ? `<line x1="${m.vue[0]}" y1="${m.sol}" x2="${m.vue[0]+m.vue[2]}" y2="${m.sol}" stroke="#7E95A8" stroke-width="2" stroke-dasharray="6 6"/>` : '')
        + M.dessine(M.squelette(p), Object.assign({}, m.opt||{}, {clair:true}));
    };
    fond(0);
  }

  function montre(){
    const e = liste[idx];
    hote.querySelector('.g-num').textContent = 'Exercice ' + (idx+1) + ' / ' + liste.length;
    hote.querySelector('.g-nom').textContent = e.nm;
    hote.querySelector('.g-sr').textContent  = e.sr;
    hote.querySelector('.g-tip').textContent = e.tip || '';
    an  = analyseSerie(e.sr);
    cfg = respiration(e.nm, an);
    plan = null;
    phase = -1; fini = false; dernierBip = -1; t0 = performance.now();
    prepareFond(e);
    hote.querySelector('.g-prev').style.visibility = idx===0 ? 'hidden' : 'visible';
    hote.querySelector('.g-next').style.visibility = idx===liste.length-1 ? 'hidden' : 'visible';
  }

  function lance(){
    try{
      ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
      if(ctx.state === 'suspended') ctx.resume();
    }catch(err){ ctx = null; }
    hote.querySelector('.g-pret').style.display = 'none';
    hote.querySelector('.g-scene').style.display = 'flex';
    t0 = performance.now(); phase = -1; fini = false; gel = 0;
    if(tempo) clearInterval(tempo);
    tempo = setInterval(()=>{ if(!fini) bip(55,.16,.30); }, 1000);
    bip(55,.16,.30);
    if(raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(image);
  }

  function stop(){
    if(raf) cancelAnimationFrame(raf); raf = null;
    if(tempo) clearInterval(tempo); tempo = null;
    gel = 0;
  }
  // Passer le repos : on avance le chrono jusqu'à la fin de la récupération en cours
  function passeRepos(){
    if(gel) return;
    const p = position((performance.now() - t0)/1000);
    if(p.genre !== 'pause') return;
    t0 -= (p.duree - p.t) * 1000;
    phase = -1; dernierBip = -1;
    bip(660,.12,.20,'square');
  }

  // Pause : on fige le chrono en décalant l'origine, rien n'est perdu
  function basculePause(){
    const b = hote.querySelector('.g-pause');
    if(gel){
      t0 += performance.now() - gel; gel = 0;
      b.textContent = 'Pause'; b.classList.remove('on');
      if(!tempo && !fini) tempo = setInterval(()=>{ if(!fini && !gel) bip(55,.16,.30); }, 1000);
    } else {
      gel = performance.now();
      b.textContent = 'Reprendre'; b.classList.add('on');
      if(tempo){ clearInterval(tempo); tempo = null; }
    }
  }
  // Stop : on abandonne l'exercice en cours et on revient à l'écran de départ
  function arrete(){
    stop();
    fini = false; phase = -1; dernierBip = -1;
    hote.querySelector('.g-pause').textContent = 'Pause';
    hote.querySelector('.g-pause').classList.remove('on');
    hote.querySelector('.g-scene').style.display = 'none';
    hote.querySelector('.g-pret').style.display = '';
    hote.querySelector('.g-pret').textContent = 'Reprendre au début';
    if(fond) fond(0);
  }
  function ferme(){ stop(); if(hote){ hote.remove(); hote = null; } }

  function va(n){
    idx = Math.max(0, Math.min(liste.length-1, idx+n));
    stop(); montre();
    hote.querySelector('.g-pret').textContent = 'Prêt ?';
    hote.querySelector('.g-pret').style.display = '';
    hote.querySelector('.g-scene').style.display = 'none';
  }

  function ouvre(ex){
    if(!ex || !ex.length) return;
    liste = ex; idx = 0;
    ferme();
    hote = document.createElement('div');
    hote.className = 'g-ov';
    hote.innerHTML = `
      <button class="g-close" aria-label="Fermer">✕</button>
      <div class="g-num"></div>
      <div class="g-nom"></div>
      <div class="g-sr"></div>
      <div class="g-tip"></div>
      <button class="g-pret">Prêt ?</button>
      <div class="g-scene">
        <div class="g-disc">
          <div class="g-fond"></div>
          <svg viewBox="-80 -80 160 160" class="g-svg">
            <circle class="g-halo" cx="0" cy="0" r="0" fill="none" stroke-width="2.5"/>
            <circle class="g-cercle" cx="0" cy="0" r="0"/>
          </svg>
          <div class="g-compte"></div>
        </div>
        <div class="g-phase"></div>
        <div class="g-serie"></div>
        <div class="g-cmd">
          <button class="g-passer">Passer le repos</button>
          <button class="g-pause">Pause</button>
          <button class="g-stop">Stop</button>
        </div>
      </div>
      <div class="g-bas">
        <button class="g-prev">Précédent</button>
        <button class="g-son" aria-pressed="true">Son</button>
        <button class="g-next">Suivant</button>
      </div>`;
    document.body.appendChild(hote);
    montre();
    hote.querySelector('.g-pret').addEventListener('click', lance);
    hote.querySelector('.g-passer').addEventListener('click', passeRepos);
    hote.querySelector('.g-pause').addEventListener('click', basculePause);
    hote.querySelector('.g-stop').addEventListener('click', arrete);
    hote.querySelector('.g-close').addEventListener('click', ferme);
    hote.querySelector('.g-prev').addEventListener('click', ()=>va(-1));
    hote.querySelector('.g-next').addEventListener('click', ()=>va(1));
    const bs = hote.querySelector('.g-son');
    bs.addEventListener('click', ()=>{ son=!son; bs.setAttribute('aria-pressed', son); bs.textContent = son?'Son':'Muet'; });
  }

  return {ouvre, ferme, analyseSerie, respiration, pause};
})();

/* ============================================================
   ÉVÉNEMENTS
   ============================================================ */
document.addEventListener('click', async (ev)=>{
  const t = ev.target.closest('[data-tab],[data-set],[data-day],[data-reg],[data-acc],[data-infos],[data-act],[data-toggle],[data-del],[data-jeune],[data-jours],[data-coche],[data-seance],[data-valide],[data-achat],[data-vider],[data-delimg],[data-notif],[data-notifcat],[data-eq],[data-saison]');
  if(!t) return;

  if(t.dataset.tab){ tab=t.dataset.tab; render(true); return; }

  if(t.dataset.toggle){
    const k=t.dataset.toggle; openSess[k]=!openSess[k]; render(); return;
  }
  if(t.dataset.set){ P[t.dataset.set]=t.dataset.val; await save(); render(); return; }
  if(t.dataset.day!==undefined){
    const i=+t.dataset.day; P.dispo[i].on=!P.dispo[i].on; await save(); render(); return;
  }
  if(t.dataset.notif){
    P.notif = P.notif || {on:false, eau:true, sport:true, repas:true};
    if(!P.notif.on){
      const ok = await Notifs.activer();
      if(!ok){ render(); return; }
      P.notif.on = true; toast('Rappels activés');
    } else {
      P.notif.on = false; toast('Rappels désactivés');
    }
    await save(); render(); return;
  }
  if(t.dataset.notifcat){
    P.notif = P.notif || {on:false, eau:true, sport:true, repas:true};
    const v = t.dataset.notifcat;
    P.notif[v] = P.notif[v] === false ? true : false;
    await save(); render(); return;
  }
  if(t.dataset.saison){
    P.saison = P.saison === false ? true : false;
    await save(); render();
    toast(P.saison ? 'Menus calés sur la saison' : 'Saisonnalité désactivée');
    return;
  }
  if(t.dataset.valide){
    const [jour, key] = t.dataset.valide.split('|');
    P.valides = P.valides || {};
    const ck = cleRepas(+jour, key);
    if(P.valides[ck]){ delete P.valides[ck]; toast('Validation annulée'); }
    else {
      P.valides[ck] = 1;
      const o = menuDuJour(+jour).out.find(x=>x.key===key);
      if(o && !o.jeune) retireDuStock(o);
      const reste = bientotEpuise().length;
      toast(reste? 'Repas validé — ' + reste + ' aliment(s) à racheter' : 'Repas validé');
    }
    await save(); render(); return;
  }
  if(t.dataset.eq){ ouvreEquiv(t.dataset.eq); return; }
  if(t.dataset.achat){ ouvreAchat(t.dataset.achat, t.dataset.besoin); return; }
  if(t.dataset.vider){
    delete stock()[t.dataset.vider];
    await save(); render(); return;
  }
  if(t.dataset.seance !== undefined){
    const plan = buildSemaine();
    const d = plan[+t.dataset.seance];
    const ex = [].concat(...d.blocs.map(b=>b.ex));
    Guide.ouvre(ex);
    return;
  }
  if(t.dataset.jours){
    P.courses = P.courses || {jours:7, coches:{}};
    P.courses.jours = +t.dataset.jours;
    await save(); render(); return;
  }
  if(t.dataset.coche){
    P.courses = P.courses || {jours:7, coches:{}};
    const k = t.dataset.coche;
    if(P.courses.coches[k]) delete P.courses.coches[k]; else P.courses.coches[k] = 1;
    await save(); render(); return;
  }
  if(t.dataset.jeune){
    P.jeune = P.jeune||{};
    const k = t.dataset.jeune;
    P.jeune[k] = !P.jeune[k];
    await save(); render();
    toast(P.jeune[k] ? 'Repas jeûné — calories reportées' : 'Repas réactivé');
    return;
  }
  if(t.dataset.infos){
    infos[t.dataset.infos] = !infos[t.dataset.infos];
    render(); return;
  }
  if(t.dataset.acc){
    P.accessoires = P.accessoires || [];
    const v = t.dataset.acc;
    P.accessoires = P.accessoires.includes(v) ? P.accessoires.filter(x=>x!==v) : [...P.accessoires, v];
    await save(); render(); return;
  }
  if(t.dataset.reg){
    P.regime = P.regime||[];
    const v=t.dataset.reg;
    // un régime plus strict rend les autres redondants
    const REDONDANT = {
      vegan:      ['vegetarien','sansViande','sansPoisson'],
      vegetarien: ['vegan','sansViande','sansPoisson'],
      sansViande: ['vegan','vegetarien'],
      sansPoisson:['vegan','vegetarien']
    };
    if(P.regime.includes(v)){
      P.regime = P.regime.filter(x=>x!==v);
    } else {
      const retire = REDONDANT[v] || [];
      P.regime = [...P.regime.filter(x=>retire.indexOf(x) < 0), v];
    }
    await save(); render(); return;
  }
  if(t.dataset.delimg){
    const d = t.dataset.delimg;
    journal = journal.map(e=>e.d===d ? {...e, img:null} : e).filter(e=>e.p||e.img);
    await save(); render(); return;
  }
  if(t.dataset.del){
    journal = journal.filter(e=>e.d!==t.dataset.del); await save(); render(); return;
  }
  const a=t.dataset.act;
  if(a==='start'){ onboarding=false; tab='profil'; await save(); render(true); toast('Renseigne tes chiffres, puis va dans « Semaine »'); return; }
  if(a==='install'){
    if(!promptInstall){ toast('Utilise le menu ⋮ de Chrome → « Installer l\'application »'); return; }
    promptInstall.prompt();
    const r = await promptInstall.userChoice;
    if(r && r.outcome==='accepted') promptInstall=null;
    return;
  }
  if(a==='shuffle'){ menuSeed++; render(); return; }
  if(a==='videpanier'){
    P.courses = P.courses || {jours:7, coches:{}};
    P.inventaire = {};
    await save(); render(); toast('Inventaire vidé'); return;
  }
  if(a==='log'){
    const p=parseFloat(document.getElementById('inP').value);
    if(isNaN(p)){ toast('Renseigne un poids'); return; }
    const d=todayISO();
    journal = journal.filter(e=>e.d!==d);
    const anc = journal.find(e=>e.d===d);
    journal = journal.filter(e=>e.d!==d);
    journal.push({d, p, img: anc? anc.img : null});
    if(!isNaN(p)) P.poids=p;
    await save(); render(); toast('Mesure enregistrée'); return;
  }
  if(a==='enregistrer'){
    await save(); tab='semaine'; render(true); toast('Profil enregistré'); return;
  }
  if(a==='reset'){ demandeEffacement(); return; }
});

// redimensionne et compresse avant stockage : une photo brute ferait plusieurs Mo
async function compresse(file, large){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=url; });
    const ech = Math.min(1, large/img.naturalWidth);
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth*ech); c.height = Math.round(img.naturalHeight*ech);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.72);
  } finally { URL.revokeObjectURL(url); }
}

document.addEventListener('change', async (ev)=>{
  if(ev.target.id === 'photoIn'){
    const file = ev.target.files && ev.target.files[0];
    if(!file) return;
    try{
      const img = await compresse(file, 520);
      const d = todayISO();
      journal = journal.filter(e=>e.d!==d || !e.img);
      const exist = journal.find(e=>e.d===d);
      if(exist) exist.img = img; else journal.push({d, p:null, img});
      await save(); render(); toast('Photo enregistrée');
    }catch(err){ toast('Impossible de lire cette image'); }
    return;
  }
  const el=ev.target;
  if(el.dataset.num){ const v=parseFloat(el.value); if(!isNaN(v)) P[el.dataset.num]=v; await save(); refreshProfilNotes(); }
  else if(el.dataset.txt){ P[el.dataset.txt]=el.value; await save(); refreshProfilNotes(); }
  else if(el.dataset.daysel){
    const i=+el.dataset.i;
    P.dispo[i][el.dataset.daysel] = el.dataset.daysel==='minutes'? +el.value : el.value;
    await save(); render();
  }
});

/* ============================================================
   NOTIFICATIONS — rappels humoristiques par événement
   ------------------------------------------------------------
   L'app n'a pas de serveur : on ne peut pas « pousser » une
   notification quand l'onglet est fermé. On planifie donc, avec
   setTimeout, les rappels des événements encore à venir dans la
   journée. Ils se déclenchent tant que l'app reste ouverte ou en
   arrière-plan. À chaque rendu et à chaque retour au premier plan,
   on replanifie pour coller au profil courant.
   ============================================================ */
const Notifs = (function(){
  // Une phrase est tirée au hasard à chaque déclenchement.
  const PHRASES = {
    eau: [
      "T'as pas soif là ?",
      "Je peux vous offrir un verre… d'eau ?",
      "Tu n'oublieras point de t'hydrater…",
      "T'hydrater tu devras…",
      "Le sport, c'est de l'eau.",
      "J'ai un message de tes reins : ON A SOIFFFF !",
      "Allez, bois, bois, bois, bois…",
      "Qu'est-ce que tu consommes comme eau ! Continue comme ça 👌",
      "Bravo, tu commences à avoir de la bouteille 😏",
      "Je peux vous payer en liquide ?",
      "Petit verre d'eau, grand pas pour ton ventre.",
      "Ton corps t'envoie un SMS : 💧💧💧",
      "H2Oui ou H2Non ?"
    ],
    sport: [
      "C'est l'heure de brûler de la graisse 🔥",
      "On travaille ta sangle ?",
      "Prochain vacuum : ton nombril touche ta colonne vertébrale !",
      "Petite séance ?",
      "Ta motivation, elle sporte bien ?",
      "Vite, la séance va bientôt commencer.",
      "Le canapé peut attendre, tes abdos non 💪",
      "On transpire un peu ? Juste un peu ? 😅",
      "Ton transverse t'attend."
    ],
    repas: [
      "C'est l'heure du buffet 🍽️",
      "L'appétit vient en mangeant.",
      "On mange un bout ?",
      "La mangeaille ?",
      "On mange au resto ce midi ?",
      "On fait le plein de protéines ?",
      "À table ! Les protéines n'attendent pas.",
      "Miam o'clock 🍽️",
      "Ton corps réclame du carburant."
    ]
  };
  const META = {
    eau:   {emoji:'💧', tag:'choco-eau'},
    sport: {emoji:'💪', tag:'choco-sport'},
    repas: {emoji:'🍽️', tag:'choco-repas'}
  };

  const dispo = () => ('Notification' in window);
  const permission = () => dispo() ? Notification.permission : 'denied';
  const catActive = (n, cat) => n && n[cat] !== false;
  const phrase = (cat) => { const l = PHRASES[cat]; return l[Math.floor(Math.random()*l.length)]; };

  // Événements du jour courant, sous forme {min, cat}. Reprend la même
  // logique horaire que la timeline de « Ta semaine ».
  function evenementsDuJour(){
    const c = calculs(P);
    const plan = buildSemaine();
    const today = (new Date().getDay()+6)%7;
    const d = plan[today];
    const seance = d.blocs.length > 0;
    const H = {matin:420, midi:750, soir:1170};
    const evs = [];
    evs.push({min:390, cat:'sport'});                       // marche à jeun
    if(seance) evs.push({min:H[d.creneau], cat:'sport'});   // séance guidée
    const J = P.jeune || {};
    [['pdj',480],['dej',795],['col',990],['din',1230]].forEach(([k,min])=>{ if(!J[k]) evs.push({min, cat:'repas'}); });
    hydratation(+c.eau, seance ? d.creneau : null).forEach(p=>evs.push({min:p.min, cat:'eau'}));
    return evs;
  }

  function montre(cat, texte){
    const meta = META[cat];
    const titre = meta.emoji + ' ' + texte;
    const opts = { body:'Chocolat 🍫', icon:'./icon-192.png', badge:'./icon-192.png', tag:meta.tag, renotify:true, lang:'fr' };
    const secours = () => { try{ new Notification(titre, opts); }catch(e){} };
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(reg=>reg.showNotification(titre, opts)).catch(secours);
    } else secours();
  }

  let timers = [];
  function planifier(){
    timers.forEach(clearTimeout);
    timers = [];
    if(!P || onboarding) return;
    const n = P.notif;
    if(!n || !n.on) return;
    if(permission() !== 'granted') return;

    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
    evenementsDuJour().forEach(e=>{
      if(!catActive(n, e.cat)) return;
      const delai = (e.min - nowMin) * 60000;
      if(delai <= 0 || delai > 24*3600000) return;
      timers.push(setTimeout(()=>montre(e.cat, phrase(e.cat)), delai));
    });
    // Peu après minuit, on replanifie pour la nouvelle journée.
    const versMinuit = (24*60 - nowMin) * 60000 + 60000;
    timers.push(setTimeout(planifier, Math.max(versMinuit, 60000)));
  }

  // Demande l'autorisation au navigateur. Renvoie true si accordée.
  async function activer(){
    if(!dispo()){ toast('Notifications non disponibles ici'); return false; }
    let perm = Notification.permission;
    if(perm === 'default'){ try{ perm = await Notification.requestPermission(); }catch(e){ perm = 'denied'; } }
    if(perm !== 'granted'){ toast('Notifications refusées par le navigateur'); return false; }
    return true;
  }

  return { planifier, activer, dispo, permission };
})();

// Replanifie quand l'app revient au premier plan (les timers longs
// peuvent être suspendus en arrière-plan sur certains systèmes).
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) Notifs.planifier(); });

});

/* ============================================================
   DÉMARRAGE
   ============================================================ */
(async function init(){
  try{
    let raw = await Store.get(CLE.profil);
    if(!raw) raw = await Store.get('sangle:profil');      // reprise des données de l'ancien nom
    if(raw){ P = {...defaultProfil, ...JSON.parse(raw)}; onboarding=false; }
    else { P = JSON.parse(JSON.stringify(defaultProfil)); onboarding=true; }
    openSess['d'+((new Date().getDay()+6)%7)] = true;   // le jour courant est déplié d'emblée
    let jr = await Store.get(CLE.journal);
    if(!jr) jr = await Store.get('sangle:journal');
    if(jr) journal = JSON.parse(jr)||[];
  }catch(e){
    P = JSON.parse(JSON.stringify(defaultProfil)); onboarding=true;
  }
  render();
})();
</script>
